# Render.com Blueprint — deploy แปลงดี (web-npa) แบบ free tier เพื่อรับ feedback
# วิธีใช้: push โค้ดขึ้น GitHub → Render → New → Blueprint → เลือก repo นี้
# แล้วกรอกค่า secret (DATABASE_URL, ADMIN_TOKEN) ในหน้า Render ตอน deploy
services:
  - type: web
    name: plaengdee
    runtime: python
    plan: free
    region: singapore              # ใกล้ไทยสุดใน free tier
    buildCommand: pip install -r requirements.txt
    startCommand: python src/web.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: HOST
        value: "0.0.0.0"           # ต้อง bind 0.0.0.0 ให้เข้าจากภายนอกได้
      - key: PUBLIC_MODE
