name: model-ops

on:
  schedule:
    - cron: "0 1 1 * *"       # 08:00 เวลาไทย ทุกวันที่ 1 ของเดือน
  workflow_dispatch:

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh + evaluate model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/model_ops.py monthly
