name: ingest

on:
  schedule:
    - cron: "0 22 * * *"      # 05:00 เวลาไทย ทุกวัน (UTC 22:00)
  workflow_dispatch:            # กดรันเองได้จากแท็บ Actions

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ingest ทุกแหล่ง (run_all)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_NOTIFY_TO: ${{ secrets.LINE_NOTIFY_TO }}
        run: python src/run_all.py --tier ${{ vars.TARGET_TIER || '1' }} --max-pages 30

      - name: Enrich (geocode + infra + grade)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/enrich.py all --detail-limit 150
