name: ingest

on:
  schedule:
    - cron: "0 22 * * *"      # 05:00 เวลาไทย ทุกวัน
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all sources + health check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_TIER: ${{ vars.TARGET_TIER || '1' }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_NOTIFY_TO: ${{ secrets.LINE_NOTIFY_TO }}
        run: python src/run_all.py

  health-midday:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Health check only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_NOTIFY_TO: ${{ secrets.LINE_NOTIFY_TO }}
        run: python src/run_all.py --health-only
---
name: model-ops

on:
  schedule:
    - cron: "0 1 1 * *"       # 08:00 เวลาไทย ทุกวันที่ 1
  workflow_dispatch:

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Refresh + evaluate model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/model_ops.py monthly
