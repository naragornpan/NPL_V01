name: ingest-weekly

# ดึงทั้งประเทศ (tier 3) รายสัปดาห์ — matrix ขนาน, จูน pages ราย source
on:
  schedule:
    - cron: "0 20 * * 6"      # อาทิตย์ 03:00 เวลาไทย (เสาร์ 20:00 UTC)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { source: bam,         pages: 40 }
          - { source: ghb,         pages: 40 }
          - { source: krungsri,   pages: 40 }   # กรุงศรี — server-render 10/หน้า
          - { source: ktb,         pages: 40 }
          - { source: ttb,         pages: 40 }
          - { source: sam,         pages: 25 }
          - { source: led_auction, pages: 15 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest ${{ matrix.source }} (tier 3 ทั้งประเทศ)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/run.py ${{ matrix.source }} --tier 3 --max-pages ${{ matrix.pages }}

  enrich:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enrich (geocode + infra + grade)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/enrich.py all --detail-limit 400

  health:
    needs: enrich
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Health + cleanup stale + LINE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_NOTIFY_TO: ${{ secrets.LINE_NOTIFY_TO }}
        run: python src/run_all.py --health-only --alert-always
